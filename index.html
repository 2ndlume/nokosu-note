<style>
:root{
  --page:#f4f4f1; --surface:#fff; --ink:#1d1d1b; --sub:#5b5b57; --line:#dcdcd6;
  --accent:#2a78d6; --accent-weak:#e8f1fb; --good:#2f8a4f; --warn:#b4560b;
  --radius:12px; --fs:18px;
}
html.large{ --fs:21px; }
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header.bar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.brand small{font-weight:400;color:var(--sub);font-size:.7rem;margin-left:6px}
.spacer{flex:1}
.fs-toggle{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;color:var(--ink)}
main{padding:24px 0 96px}
h1{font-size:1.6rem;line-height:1.4;margin:.2em 0 .4em}
h2{font-size:1.25rem;margin:1.4em 0 .5em}
.lead{color:var(--sub)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink);font-weight:400}
.btn.block{display:flex;width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.feat{display:grid;gap:12px;margin:20px 0}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.feat b{display:block}
.note{font-size:.85rem;color:var(--sub)}
.warnbox{background:#fff7ec;border:1px solid #f0d2ac;border-radius:10px;padding:12px 14px;font-size:.9rem}
/* progress */
.prog{height:12px;background:#e6e6e0;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s}
.part-title{font-size:1rem;color:var(--sub);margin:28px 0 8px;font-weight:600}
.ch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;margin:10px 0;cursor:pointer;font-size:1rem;color:var(--ink)}
.ch:hover{border-color:var(--accent)}
.ch .no{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.ch .t{flex:1}
.ch .t b{display:block}
.ch .t span{font-size:.8rem;color:var(--sub)}
.ch .pct{flex:none;font-size:.85rem;color:var(--sub);min-width:4.5em;text-align:right}
.ch.done .no{background:var(--good);color:#fff}
.ch[disabled]{opacity:.55;cursor:default}
.ch[disabled]:hover{border-color:var(--line)}
/* form */
.field{margin:22px 0}
.field > label, .field > .lbl{display:block;font-weight:600;margin-bottom:6px}
.opt-badge{font-size:.7rem;background:#e6e6e0;color:#5b5b57;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:3px;font-weight:600}
.req{font-size:.7rem;background:#c33;color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.help{font-size:.82rem;color:var(--sub);margin:-2px 0 6px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:1px solid #bdbdb5;border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{outline:3px solid var(--accent-weak);border-color:var(--accent)}
textarea{min-height:140px;resize:vertical}
.ymd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ymd input{width:6.5em}
.ymd select{width:auto;min-width:5em}
.wareki{font-size:.85rem;color:var(--sub);min-width:6em}
.derived{margin-top:8px;font-size:.9rem;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 18px;border-radius:999px;border:1px solid #bdbdb5;background:#fff;font-size:1rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hints{margin:0 0 8px;padding:10px 14px;background:var(--accent-weak);border-radius:10px;font-size:.85rem}
.hints b{display:block;color:var(--accent);font-size:.8rem}
.row{border:1px dashed #c9c9c1;border-radius:var(--radius);padding:4px 16px 12px;margin:12px 0;background:#fcfcfa}
.row-head{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.row-head b{font-size:.95rem}
.del{background:none;border:none;color:#a33;font-size:.85rem;cursor:pointer;padding:6px}
.row .field{margin:14px 0}
.chnav{display:flex;gap:12px;margin-top:32px}
.chnav .btn{flex:1}
.crumb{background:none;border:none;color:var(--accent);font-size:.9rem;cursor:pointer;padding:0;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:.92}
/* paper (preview & print) */
.paper{background:#fff;border:1px solid var(--line);border-radius:4px;padding:40px 36px;margin:20px 0;box-shadow:0 2px 10px rgba(0,0,0,.05);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;line-height:1.9}
.paper .cover{text-align:center;padding:60px 0 40px;border-bottom:1px solid #ccc;margin-bottom:24px}
.paper .cover .ttl{font-size:2rem;letter-spacing:.3em;margin:0}
.paper .cover .who{font-size:1.2rem;margin-top:36px}
.paper .cover .dt{font-size:.9rem;color:#555;margin-top:12px}
.paper h3{font-size:1.2rem;border-left:5px solid #555;padding-left:10px;margin:36px 0 12px}
.paper h4.grp{font-size:1.08rem;border-bottom:1px solid #999;padding-bottom:2px;margin-top:28px}
.paper h4{font-size:1rem;margin:20px 0 6px;color:#333}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:.95rem}
.paper th,.paper td{border:1px solid #bbb;padding:8px 10px;vertical-align:top;text-align:left}
.paper th{width:32%;background:#f5f5f2;font-weight:600}
.paper .txt{white-space:pre-wrap;border:1px solid #bbb;padding:10px 12px;min-height:3em;margin:6px 0 12px}
.paper .blank{min-height:5em}
.paper .foot{margin-top:40px;font-size:.75rem;color:#777;text-align:center;font-family:system-ui,sans-serif}
.paper .empty-msg{color:#888;font-size:.9rem}
.opt{display:flex;gap:10px;align-items:center;font-size:.9rem;margin:8px 0}
.opt input{width:22px;height:22px}
@media (min-width:640px){ .feat{grid-template-columns:repeat(3,1fr)} }
@media (max-width:480px){ .paper{padding:24px 16px} h1{font-size:1.4rem} .brand small{display:none} }
@media print{
  @page{size:A4;margin:16mm 14mm}
  html{font-size:11pt}
  body{background:#fff}
  header.bar,.no-print,.toast{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .paper{border:none;box-shadow:none;padding:0;margin:0}
  .paper .cover{height:240mm;display:flex;flex-direction:column;justify-content:center;border:none;margin:0;break-after:page}
  .paper .chap{break-before:page}
  .paper .chap:first-of-type{break-before:auto}
  .paper h3,.paper h4{break-after:avoid}
  .paper .foot{margin-top:10px}
  .paper th,.paper td{padding:5px 8px}
  .paper table,.paper .txt{break-inside:avoid}
}
</style>
</head>

/* ===== 保存 ===== */
var data = load();
function load(){
  try{ var s = localStorage.getItem(STORE_KEY); if(s){ var o = JSON.parse(s); if(o && o.data) return o.data; } }catch(e){}
  return {};
}
var saveTimer = null;
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({app:'nokosu-note', v:1, updated:new Date().toISOString(), data:data}));
    toast('保存しました');
  }catch(e){ toast('この端末では保存できませんでした'); }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }
function hasData(){ return Object.keys(data).some(function(k){ return filled(data[k]); }); }

/* ===== 表示用の小道具 ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function filled(v){
  if(v==null) return false;
  if(typeof v==='string') return v.trim()!=='';
  if(Array.isArray(v)) return v.some(function(r){ return r && Object.keys(r).some(function(k){return filled(r[k]);}); });
  if(typeof v==='object') return filled(v.y);
  return false;
}
function wareki(y){
  y = parseInt(y,10); if(!y || y<1868 || y>2100) return '';
  var e, n;
  if(y>=2019){e='令和';n=y-2018;} else if(y>=1989){e='平成';n=y-1988;} else if(y>=1926){e='昭和';n=y-1925;} else if(y>=1912){e='大正';n=y-1911;} else {e='明治';n=y-1867;}
  return e+(n===1?'元':n)+'年';
}
function eto(y){ y=parseInt(y,10); if(!y) return ''; return ['申','酉','戌','亥','子','丑','寅','卯','辰','巳','午','未'][y%12]+'年'; }
function seiza(m,d){
  m=parseInt(m,10); d=parseInt(d,10); if(!m||!d) return '';
  var t=[[1,20,'山羊座','水瓶座'],[2,19,'水瓶座','魚座'],[3,21,'魚座','牡羊座'],[4,20,'牡羊座','牡牛座'],[5,21,'牡牛座','双子座'],[6,22,'双子座','蟹座'],
         [7,23,'蟹座','獅子座'],[8,23,'獅子座','乙女座'],[9,23,'乙女座','天秤座'],[10,24,'天秤座','蠍座'],[11,23,'蠍座','射手座'],[12,22,'射手座','山羊座']][m-1];
  return d<t[1]?t[2]:t[3];
}
function ymdText(v){
  if(!v||!v.y) return '';
  var s = v.y+'年'; var w=wareki(v.y); if(w) s+='（'+w+'）';
  if(v.m) s+=' '+v.m+'月'; if(v.d) s+=v.d+'日';
  return s;
}
function yearText(y){ if(!y) return ''; var w=wareki(y); return y+'年'+(w?'（'+w+'）':''); }
function todayText(){ var d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1400); }

/* ===== 進捗 ===== */
function chapterProgress(ch){
  if(ch.soon) return null;
  var fs=ch.fields.filter(function(f){return f.type!=='info';}); var total=fs.length, got=0;
  fs.forEach(function(f){ if(filled(data[f.k])) got++; });
  return Math.round(got/total*100);
}
function overallProgress(){
  var list=READY.filter(function(c){return !c.optional;}); var sum=0; list.forEach(function(c){ sum+=chapterProgress(c); }); return Math.round(sum/list.length);
}

/* ===== 画面：章の入力 ===== */
function fieldHtml(f, val, ctx){
  // ctx: {rk, ri} repeat context or null
  if(f.type==='info') return '<div class="hints" style="font-size:.9rem;margin:18px 0">'+f.html+'</div>';
  var attrs = ctx ? ' data-rk="'+ctx.rk+'" data-ri="'+ctx.ri+'" data-sk="'+f.k+'"' : ' data-k="'+f.k+'"';
  var id = 'f_'+(ctx?ctx.rk+'_'+ctx.ri+'_':'')+f.k;
  var h = '<div class="field">';
  var lblTag = (f.type==='chips'||f.type==='ymd') ? '<span class="lbl">' : '<label for="'+id+'">';
  var lblEnd = (f.type==='chips'||f.type==='ymd') ? '</span>' : '</label>';
  if(f.label) h += lblTag+esc(f.label)+(f.req?'<span class="req">必須</span>':'')+lblEnd;
  if(f.help) h += '<p class="help">'+esc(f.help)+'</p>';
  if(f.type==='text'){
    h += '<input type="text" id="'+id+'"'+attrs+' value="'+esc(val||'')+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.mode?' inputmode="'+f.mode+'"':'')+'>';
  }else if(f.type==='textarea'){
    if(f.hints) h += '<div class="hints"><b>たとえば、こんなことを</b>'+f.hints.map(esc).join('／')+'</div>';
    h += '<textarea id="'+id+'"'+attrs+'>'+esc(val||'')+'</textarea>';
  }else if(f.type==='year'){
    h += '<div class="ymd"><input type="text" id="'+id+'"'+attrs+' inputmode="numeric" maxlength="4" placeholder="例：1975" value="'+esc(val||'')+'"><span>年</span><span class="wareki" data-wareki-for="'+id+'">'+esc(wareki(val))+'</span></div>';
  }else if(f.type==='chips'){
    h += '<div class="chips">'+f.options.map(function(o){
      return '<button type="button" class="chip'+(val===o?' on':'')+'"'+attrs+' data-v="'+esc(o)+'">'+esc(o)+'</button>';
    }).join('')+'</div>';
  }else if(f.type==='ymd'){
    val = val||{};
    var ms='<option value="">月</option>', ds='<option value="">日</option>';
    for(var m=1;m<=12;m++) ms+='<option'+(String(val.m)===String(m)?' selected':'')+'>'+m+'</option>';
    for(var d=1;d<=31;d++) ds+='<option'+(String(val.d)===String(d)?' selected':'')+'>'+d+'</option>';
    h += '<div class="ymd"><input type="text" id="'+id+'_y" data-k="'+f.k+'" data-part="y" inputmode="numeric" maxlength="4" placeholder="例：1955" value="'+esc(val.y||'')+'" aria-label="生まれた年（西暦）"><span>年</span>'+
         '<span class="wareki" data-wareki-for="'+id+'_y">'+esc(wareki(val.y))+'</span>'+
         '<select data-k="'+f.k+'" data-part="m" aria-label="月">'+ms+'</select><span>月</span>'+
         '<select data-k="'+f.k+'" data-part="d" aria-label="日">'+ds+'</select><span>日</span></div>'+
         '<p class="help" style="margin-top:6px">年は西暦で入力してください（和暦は自動で表示されます）。</p>'+
         '<div class="derived" data-derived="'+f.k+'">'+derivedText(val)+'</div>';
  }else if(f.type==='repeat'){
    var rows = Array.isArray(val) && val.length ? val : [];
    while(rows.length < (f.min||0)) rows.push({});
    h += rows.map(function(r,i){
      return '<div class="row"><div class="row-head"><b>'+esc(f.rowLabel)+' '+(i+1)+'</b>'+
        (rows.length>(f.min||0)?'<button type="button" class="del" data-del="'+f.k+'" data-ri="'+i+'">この'+esc(f.rowLabel)+'を削除</button>':'')+'</div>'+
        f.fields.map(function(sf){ return fieldHtml(sf, r[sf.k], {rk:f.k, ri:i}); }).join('')+'</div>';
    }).join('');
    h += '<button type="button" class="btn ghost" data-add="'+f.k+'" data-min="'+(f.min||0)+'">＋ '+esc(f.add)+'</button>';
  }
  return h+'</div>';
}
function derivedText(v){
  if(!v||!v.y) return '';
  var parts=[]; var e=eto(v.y); if(e) parts.push('干支：'+e); var s=seiza(v.m,v.d); if(s) parts.push('星座：'+s);
  return parts.length ? parts.join('　') : '';
}

  READY.forEach(function(ch){

      if(f.type==='textarea'){
        flushRows();
        if(filled(v)) body += '<h4>'+esc(f.label)+'</h4><div class="txt">'+esc(v)+'</div>';
        else if(showEmpty) body += '<h4>'+esc(f.label)+'</h4><div class="txt blank"></div>';
      }else if(f.type==='repeat'){
        flushRows();
        var list = Array.isArray(v) ? v.filter(function(r){ return filled([r]); }) : [];
        if(!list.length && showEmpty) list = [{}];
        if(list.length && f.min===0) body += '<h4 class="grp">'+esc(f.label)+'</h4>';
        list.forEach(function(r,i){
          var t = f.rowLabel+(list.length>1?' '+(i+1):'');
          if(f.k==='schools' && r.kind) t = r.kind;
          if(f.k==='messages' && r.to) t = r.to;
          if(f.titleKey && filled(r[f.titleKey])) t = r[f.titleKey];
          body += '<h4>'+esc(t)+'</h4>';
          var sub='';
          f.fields.forEach(function(sf){
            if(f.k==='schools'&&sf.k==='kind') return;
            if(f.k==='messages'&&sf.k==='to') return;
            if(f.titleKey===sf.k && filled(sv0(r,sf))) return;
            var sv = r[sf.k];
            if(sf.type==='textarea'){
              if(sub){ body+='<table>'+sub+'</table>'; sub=''; }
              if(filled(sv)) body += '<div class="txt">'+esc(sv)+'</div>';
              else if(showEmpty) body += '<div class="txt blank"></div>';
            }else{
              var txt = sf.type==='year' ? yearText(sv) : (sv||'');
              if(filled(txt)||showEmpty) sub += noteRow(sf.label||'状況', txt);
            }
          });
          if(sub) body+='<table>'+sub+'</table>';
        });
      }else{
        var txt = f.type==='ymd' ? ymdText(v) : (v||'');
        if(f.type==='ymd' && v && v.y){ var dv=derivedText(v); if(dv) txt += '\n'+dv.replace('　',' ／ '); }
        if(filled(txt)||showEmpty) rows += '<tr><th>'+esc(f.label)+'</th><td style="white-space:pre-wrap">'+esc(txt)+'</td></tr>';
      }
    });
    flushRows();
    if(!body) return;
    h += '<section class="chap"><h3>第'+ch.no+'章　'+esc(ch.title)+'</h3>'+body+'</section>';
  });
  var FOOT = '<div class="foot">このノートは「のこすノート｜無料で作れる終活ノート」で作成しました。</div>';
  var withApx = h.indexOf('class="chap"')>=0 || showEmpty;
  if(withApx) h += APPENDIX.replace(/<\/section>$/, FOOT+'</section>');
  if(h.indexOf('class="chap"')<0) h += '<p class="empty-msg" style="text-align:center">まだ何も記入されていません。目次から書きはじめましょう。</p>';
  if(!withApx) h += FOOT;
  return h;
}

 '</table></section>'+
 '<section class="chap"><h3>付録2　用語集</h3><table>'+

var showEmpty = false;
function viewPreview(){
  return '<div class="no-print">'+
    '<button class="crumb" type="button" data-go="#toc">← 目次に戻る</button>'+
    '<h1>できたノート</h1>'+
    '<p class="lead">これが印刷・PDFになるノートです。書き足したい所があれば、目次から戻って書けます。</p>'+

      '<p class="note" style="margin:.3em 0 0">下のボタンを押すと印刷画面が開きます。パソコンでは「送信先」で「PDFに保存」を、スマホでは共有ボタンから「ファイルに保存」を選んでください。</p>'+
      '<label class="opt"><input type="checkbox" id="optEmpty"'+(showEmpty?' checked':'')+'> 未記入の項目も空欄で印刷する（あとで手書きできます）</label>'+
      '<div class="btn-row"><button class="btn block" type="button" data-act="print">PDFにする・印刷する</button></div>'+

      '<p class="note" style="margin:.3em 0 0">相続診断士が、ノートの内容をもとに無料でご相談をお受けしています。実家じまいの準備が気になる方は、無料の診断もお使いください。</p>'+
      '<div class="btn-row"><a class="btn ghost" href="#" data-act="consult">無料で相談する（準備中）</a><a class="btn plain" href="https://shindan.2ndlume.com/" target="_blank" rel="noopener" data-track="shindan_click">実家じまい診断を受ける</a></div>'+
    '</div>'+
    '<div class="card"><b>年に1回、見直しのお知らせを受け取る</b>'+
      '<p class="note" style="margin:.3em 0 0">家族構成や気持ちは変わっていくもの。年に1回、見直しのタイミングをメールでお知らせします。（準備中）</p>'+

/* ===== アクセス計測（入力内容は送信しない） ===== */
function track(name, params){
  try{ if(typeof window.gtag==='function') window.gtag('event', name, Object.assign({app_name:'nokosu-note'}, params||{})); }catch(e){}
}
function screenName(h){
  if(h.indexOf('#ch/')===0){ var c=chapterById(h.slice(4)); return c ? '第'+c.no+'章 '+c.title : '章'; }
  return {'#toc':'目次','#preview':'できたノート'}[h] || 'トップ';
}

/* ===== ルーティング ===== */
var app = document.getElementById('app');
function route(){
  var hsh = location.hash || '#top';
  var html;
  if(hsh.indexOf('#ch/')===0) html = viewChapter(hsh.slice(4));
  else if(hsh==='#toc') html = viewToc();
  else if(hsh==='#preview') html = viewPreview();
  else html = viewTop();
  app.innerHTML = html;
  window.scrollTo(0,0);
  track('page_view', {page_title:'のこすノート｜'+screenName(hsh), page_location:location.origin+location.pathname+hsh});
}
window.addEventListener('hashchange', route);

/* ===== 入力の反映 ===== */
function setFromEl(el){
  var v = el.value;
  if(el.dataset.rk){
    var arr = Array.isArray(data[el.dataset.rk]) ? data[el.dataset.rk] : [];
    var i = parseInt(el.dataset.ri,10);
    while(arr.length<=i) arr.push({});
    arr[i][el.dataset.sk] = v; data[el.dataset.rk] = arr;
  }else if(el.dataset.part){
    var o = (data[el.dataset.k] && typeof data[el.dataset.k]==='object') ? data[el.dataset.k] : {};
    o[el.dataset.part] = v; data[el.dataset.k] = o;
    var dv = document.querySelector('[data-derived="'+el.dataset.k+'"]'); if(dv) dv.textContent = derivedText(o);
  }else{
    data[el.dataset.k] = v;
  }
  if(el.id){ var w = document.querySelector('[data-wareki-for="'+el.id+'"]'); if(w) w.textContent = wareki(v); }
}
app.addEventListener('input', function(e){
  var el = e.target;
  if(el.dataset && (el.dataset.k || el.dataset.rk) && !el.classList.contains('chip')){ setFromEl(el); saveSoon(); }
});
app.addEventListener('change', function(e){
  var el = e.target;
  if(el.id==='optEmpty'){ showEmpty = el.checked; document.getElementById('paper').innerHTML = renderNote(showEmpty); return; }
  if(el.tagName==='SELECT' && el.dataset.k){ setFromEl(el); saveSoon(); }
});
app.addEventListener('click', function(e){
  var el = e.target.closest('button, a'); if(!el) return;
  if(el.dataset.track) track(el.dataset.track);
  if(el.dataset.go){ location.hash = el.dataset.go; return; }
  if(el.classList.contains('chip')){
    var cur = el.dataset.rk ? ((data[el.dataset.rk]||[])[el.dataset.ri]||{})[el.dataset.sk] : data[el.dataset.k];
    var nv = (cur===el.dataset.v) ? '' : el.dataset.v;
    if(el.dataset.rk){
      var arr = Array.isArray(data[el.dataset.rk]) ? data[el.dataset.rk] : [];
      var i = parseInt(el.dataset.ri,10); while(arr.length<=i) arr.push({});
      arr[i][el.dataset.sk] = nv; data[el.dataset.rk] = arr;
    }else data[el.dataset.k] = nv;
    var sib = el.parentNode.querySelectorAll('.chip');
    for(var j=0;j<sib.length;j++) sib[j].classList.toggle('on', sib[j].dataset.v===nv && nv!=='');
    save(); return;
  }
  if(el.dataset.add){
    var k = el.dataset.add, mn = parseInt(el.dataset.min||'0',10), a = Array.isArray(data[k]) ? data[k] : [];
    while(a.length < mn) a.push({});
    a.push({}); data[k] = a; save(); rerenderKeepScroll(); return;
  }
  if(el.dataset.del){
    if(!confirm('この欄の内容を削除しますか？')) return;
    var dk = el.dataset.del, da = Array.isArray(data[dk]) ? data[dk] : [];
    da.splice(parseInt(el.dataset.ri,10),1); data[dk] = da; save(); rerenderKeepScroll(); return;
  }
  var act = el.dataset.act;
  if(act==='print'){ track('pdf_print', {progress:overallProgress(), with_blank:showEmpty?'yes':'no'}); window.print(); }
  else if(act==='export'){ exportBackup(); }
  else if(act==='import'){ document.getElementById('importFile').click(); }
  else if(act==='clear'){
    if(confirm('入力した内容をすべて消去します。元に戻せません。よろしいですか？')){
      data = {}; try{ localStorage.removeItem(STORE_KEY); }catch(err){} toast('消去しました'); route();
    }
  }
  else if(act==='consult'){ e.preventDefault(); track('consult_click'); alertBox('相談窓口は準備中です。'); }
});
function alertBox(msg){ toast(msg); }
function rerenderKeepScroll(){ var y = window.scrollY; route(); window.scrollTo(0,y); }

/* ===== バックアップ ===== */
function exportBackup(){
  try{
    var blob = new Blob([JSON.stringify({app:'nokosu-note', v:1, exported:new Date().toISOString(), data:data}, null, 2)], {type:'application/json'});
    var d = new Date(), stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nokosu-note-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('バックアップを保存しました'); track('backup_export');
  }catch(e){ toast('保存できませんでした'); }
}
document.getElementById('importFile').addEventListener('change', function(){
  var f = this.files && this.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      if(!o || o.app!=='nokosu-note' || !o.data) throw new Error('bad');
      if(hasData() && !confirm('今この端末にある内容を、バックアップの内容で置き換えます。よろしいですか？')) return;
      data = o.data; save(); toast('読み込みました'); track('backup_import'); location.hash = '#toc'; route();
    }catch(e){ toast('このファイルは読み込めませんでした'); }
  };
  r.readAsText(f); this.value='';
});

/* ===== 文字サイズ ===== */
var fsBtn = document.getElementById('fsToggle');
function applyFs(large){ document.documentElement.classList.toggle('large', large); fsBtn.textContent = large ? '文字を標準に' : '文字を大きく'; }
var large=false; try{ large = localStorage.getItem(UI_KEY)==='large'; }catch(e){}
applyFs(large);
fsBtn.addEventListener('click', function(){ large=!large; applyFs(large); try{ localStorage.setItem(UI_KEY, large?'large':''); }catch(e){} });

route();
})();
</script>
